name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Install project dependencies
        run: pio lib install

      - name: Copy example sketch
        run: cp examples/Basic-Listener-ESP32/Basic-Listener-ESP32.ino src/

      - name: Build firmware
        run: pio run -e esp32dev

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore dotnet/LocoNet.slnx

      - name: Build
        run: dotnet build dotnet/LocoNet.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test dotnet/LocoNet.slnx --configuration Release --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
